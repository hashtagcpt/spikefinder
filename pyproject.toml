[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spikefinder"
version = "0.1.0"
description = "Automatic landmark (peak) marking for Lenstar A-scans from .esx files, with a portable review window"
readme = "README.md"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Operating System :: OS Independent", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Medical Science Apps."]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]
research = ["pandas", "openpyxl"]

[project.scripts]
spikefinder = "spikefinder.cli:main"

[project.gui-scripts]
spikefinder-gui = "spikefinder.cli:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spikefinder = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
