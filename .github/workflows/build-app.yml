# Builds a standalone SpikeFinder app per OS with PyInstaller. Run manually (Actions tab) or push a tag like v0.1.0.
# Not tested by the author on every OS yet - check the artifacts before distributing.
name: build-app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --noconfirm --windowed --name SpikeFinder --collect-data spikefinder packaging/launch_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpikeFinder-${{ matrix.os }}
          path: dist/
